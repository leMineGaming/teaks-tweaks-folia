name: Build

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the plugin
        run: ./gradlew build releaseJar --no-daemon --stacktrace

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: TeaksTweaks
          path: build/release/TeaksTweaks-v*.jar
          if-no-files-found: error
