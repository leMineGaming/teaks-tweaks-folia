name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (for example 2.2.0 or v2.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${{ github.ref_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No release tag was provided."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build the plugin
        run: ./gradlew build releaseJar --no-daemon --stacktrace

      - name: Verify the tag matches the project version
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          VERSION="$(grep -oP '^version = "\K[^"]+' build.gradle.kts)"
          TAG_VERSION="${TAG#v}"

          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match the project version '$VERSION' in build.gradle.kts."
            exit 1
          fi

          test -f "build/release/TeaksTweaks-v$VERSION.jar" || {
            echo "::error::Expected jar build/release/TeaksTweaks-v$VERSION.jar was not produced."
            exit 1
          }

      - name: Upload the plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: TeaksTweaks
          path: build/release/TeaksTweaks-v*.jar
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: TeaksTweaks ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: build/release/TeaksTweaks-v*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(steps.release.outputs.tag, '-') }}
